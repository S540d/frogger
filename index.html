<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1>Frogger</h1>
    <div id="picker-buttons">
      <button id="character-btn" title="Spielfigur auswählen">⚙️ Figur <span id="character-preview">🐸</span></button>
      <button id="level-btn" title="Level auswählen">🚩 Level <span id="level-preview">1</span></button>
    </div>
    <div id="character-panel" class="hidden">
      <p>Wähle deine Spielfigur:</p>
      <div id="character-options"></div>
    </div>
    <div id="level-panel" class="hidden">
      <p>Wähle dein Level:</p>
      <div id="level-options"></div>
    </div>
    <div id="hud">
      <span>Punkte: <span id="score">0</span></span>
      <span>Leben: <span id="lives">3</span></span>
      <span>Level: <span id="level">1</span></span>
    </div>
    <div id="sub-hud">
      <span id="animals-row">Tiere: <span id="animals"></span></span>
      <span id="record-row" class="hidden">Rekord: <span id="record">0</span></span>
    </div>
    <div id="canvas-wrap">
      <canvas id="game" width="480" height="560"></canvas>
      <div id="overlay">
        <div id="overlay-content">
          <h2 id="overlay-title">Frogger</h2>
          <p id="overlay-text">Bring den Frosch sicher ans andere Ufer!</p>
          <button id="start-btn">Start</button>
        </div>
      </div>
    </div>
    <p class="hint">Steuerung: Pfeiltasten oder WASD – auf dem Handy einfach über das Spielfeld wischen</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
